name: offpost

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

volumes:
  offpost_postgres_data:
    external: true
  pdf_tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

services:

  # :: Roundcube service with MySQL backend ::
  roundcube:
    image: roundcube/roundcubemail:1.4.x-apache
    networks:
      - app-network
    links:
      - mysql
    ports:
      - "25080:80"
    volumes:
      - ./organizer/src/username-password.php:/username-password.php
      - /opt/offpost/secrets/username-password-override-prod.php:/username-password-override.php
      - ./roundcubemail.config.php:/var/roundcube/config/config.email-engine.inc.php
    restart: unless-stopped

  mysql:
    image: mysql:5.6
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: roundcubemail
      MYSQL_USER: mail
      MYSQL_PASSWORD: mail
    restart: unless-stopped


  # :: Organizer service with PostgreSQL backend ::
  postgres:
    image: postgres:15.19  # Pinned: a floating tag restarts the db on any deploy that pulls a new patch release
    networks:
      - app-network
    environment:
      POSTGRES_DB: offpost
      POSTGRES_USER: offpost
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - offpost_postgres_data:/var/lib/postgresql/data
      - /opt/offpost/secrets/postgres_password:/run/secrets/postgres_password:ro
    restart: unless-stopped

  adminer:
    image: adminer:5.3.0
    networks:
      - app-network
    ports:
      - "25084:8080"
    depends_on:
      - postgres
    links:
      - postgres:postgres
    environment:
      - ADMINER_DEFAULT_SERVER=postgres

  organizer:
    # Runs the image as built: code and vendor/ are in the image, nothing is mounted
    # over /php-frontend. GIT_SHA is set by infrastructure/production/deploy-cronjob.sh.
    build:
      context: ./organizer
      args:
        GIT_SHA: ${GIT_SHA:-}
    networks:
      - app-network
    ports:
      - "25081:80"
    depends_on:
      - postgres
    links:
      - postgres:postgres
      - mysql:mysql
    volumes:
      - /opt/offpost/secrets/username-password-override-prod.php:/username-password-override.php
      - /opt/offpost/data/:/organizer-data
      - ./data/entities.json:/organizer-data/entities.json
      - /opt/offpost/secrets/postgres_password:/run/secrets/postgres_password:ro
      - /opt/offpost/secrets/openai_api_key:/run/secrets/openai_api_key:ro
      - /opt/offpost/secrets/np_api_token:/run/secrets/np_api_token:ro
      - /opt/offpost/secrets/admin_api_token:/run/secrets/admin_api_token:ro
      - pdf_tmpfs:/tmp/pdf_extraction
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=offpost
      - DB_USER=offpost
      - DB_PASSWORD_FILE=/run/secrets/postgres_password
    restart: unless-stopped

  cron:
    build: ./cron-scheduler
    volumes:
      # Deploy pause flag and lock, see infrastructure/production/deploy-cronjob.sh
      - /opt/offpost/run:/offpost-run:ro
    networks:
    - app-network
    restart: unless-stopped
